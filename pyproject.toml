[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenki-open-webui"
version = "0.1.1"
description = "Run Python and shell code in isolated, ephemeral Tenki microVM sandboxes from Open WebUI — a secure code interpreter / code execution sandbox (Tool + Action)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LuxorLabs" }]
requires-python = ">=3.11"
keywords = [
    "open-webui",
    "code-execution",
    "code-interpreter",
    "tool",
    "function",
    "sandbox",
    "python",
    "microvm",
    "firecracker",
    "tenki",
]
dependencies = [
    "tenki[async]>=1.4.1",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/LuxorLabs/tenki-open-webui"
Repository = "https://github.com/LuxorLabs/tenki-open-webui"

[tool.hatch.build.targets.wheel]
packages = ["src/tenki_open_webui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# The files under open-webui/ are generated by scripts/build.py (inlined single
# files); lint the source of truth in src/ instead.
extend-exclude = ["open-webui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The frontmatter block embeds a long, keyword-rich description on one line.
"scripts/build.py" = ["E501"]
